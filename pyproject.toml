[build-system]
requires = ["scikit-build-core"]
build-backend = "scikit_build_core.build"

[project]
name = "opentimelineio-raven"
dynamic = ["version"]
description = "OpenTimelineIO viewer app made with Dear ImGui."
authors = [
    { name = "Contributors to the OpenTimelineIO project", email = "otio-discussion@lists.aswf.io"}
]
classifiers = [
    "Programming Language :: C++",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Display",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Natural Language :: English"
]
keywords = ["film", "tv", "editing", "editorial", "edit", "non-linear", "time", "otio", "opentimelineio", "raven"]
license = { file = "LICENSE.txt" }
readme = "README.md"
requires-python = ">=3.9.0,<3.13"

[project.scripts]
raven = "otio_raven._wrapper:main"

[project.urls]
"Homepage" = "https://github.com/OpenTimelineIO/raven"
"Bug Tracker" = "https://github.com/OpenTimelineIO/raven/issues"

[tool.scikit-build]
# arm64/universal2 builds want >=3.19.2
cmake.version = ">=3.19.2"
cmake.build-type = "Release"
wheel.packages = ["python/otio_raven"]
wheel.install-dir = "otio_raven"
# tag 3.9 build as py3-none-<platform> since raven ships no Python dependent code
wheel.py-api = "py3"

[[tool.dynamic-metadata]]
field = "version"
provider = "scikit_build_core.metadata.regex"
input = "VERSION.txt"
regex = "^(?P<value>.+)"
result = "{value}"

[tool.cibuildwheel]
# build with Py3.9 once per platform
build = "cp39-*"
skip = "*-musllinux*"
test-command = "raven --version"

[tool.cibuildwheel.linux]
# glfw -> needs X11 dev headers
# nativefiledialog -> needs GTK3
# minizip-ng -> needs zlib
before-all = "dnf install -y libX11-devel libXrandr-devel libXinerama-devel libXcursor-devel libXi-devel mesa-libGL-devel gtk3-devel"
# Skip Wayland backend to avoid pulling the wayland/libdecor dep chain.
environment = { CMAKE_ARGS = "-DGLFW_BUILD_WAYLAND=OFF" }

[tool.cibuildwheel.macos]
# CMakeLists forces a universal (x86_64, arm64) build
archs = ["universal2"]
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }

[tool.cibuildwheel.windows]
# x64 only, 32-bit support
archs = ["AMD64"]
before-all = "vcpkg install zlib:x64-windows"
environment = { CMAKE_PREFIX_PATH = "C:/vcpkg/installed/x64-windows" }