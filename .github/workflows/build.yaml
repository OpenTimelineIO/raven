name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  Linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libglfw3-dev libgtk-3-dev

    - name: Build
      run: |
        mkdir build
        cd build
        cmake ..
        cmake --build . --parallel 4

    - name: Check Product
      run: |
        cd build
        ls -l
        file raven

    - name: Package Product
      run: |
        cd build
        chmod +x raven
        zip -r raven-linux.zip raven

    - name: Archive Product
      uses: actions/upload-artifact@v7
      with:
        name: raven-linux.zip
        path: build/raven-linux.zip

  MacOS:
    runs-on: macOS-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
        submodules: recursive

    - name: Build
      run: |
        mkdir build
        cd build
        cmake ..
        cmake --build . --parallel 4

    - name: Check Product
      run: |
        cd build
        ls -l
        file raven

    - name: Package Product
      run: |
        cd build
        chmod +x raven
        zip -r raven-mac.zip raven

    - name: Archive Product
      uses: actions/upload-artifact@v7
      with:
        name: raven-mac.zip
        path: build/raven-mac.zip

  Emscripten:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
        submodules: recursive

    - name: Install Dependencies
      run: |
        wget -q https://github.com/emscripten-core/emsdk/archive/master.tar.gz
        tar -xvf master.tar.gz
        emsdk-master/emsdk update
        emsdk-master/emsdk install latest
        emsdk-master/emsdk activate latest

    - name: Pre-build zlib port
      run: |
        source emsdk-master/emsdk_env.sh
        embuilder build zlib

    - name: Build
      run: |
        source emsdk-master/emsdk_env.sh
        mkdir build-web
        cd build-web
        emcmake cmake .. \
            -DCMAKE_C_FLAGS="-sUSE_ZLIB=1" \
            -DCMAKE_CXX_FLAGS="-sUSE_ZLIB=1" \
            -DCMAKE_EXE_LINKER_FLAGS="-sUSE_ZLIB=1"
        cmake --build . --parallel 4

    - name: Check Product
      run: |
        ls -l build-web

    - name: Package Product
      run: |
        cd build-web
        zip -r raven-web.zip raven.html raven.wasm raven.js raven.worker.js

    - name: Archive Product
      uses: actions/upload-artifact@v7
      with:
        name: raven-web.zip
        path: build-web/raven-web.zip

  Windows:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
        submodules: recursive

    - name: Install ZLIB
      run: |
        vcpkg install zlib:x64-windows
        echo "CMAKE_PREFIX_PATH=C:/vcpkg/installed/x64-windows" >> $env:GITHUB_ENV

    - name: Build
      run: |
        mkdir build_win64
        cd build_win64
        cmake ..
        cmake --build . --config Release --parallel 4

    # package .exe and .dll into a zip file for distribution
    - name: Package Product
      shell: pwsh
      run: |
        cmake --install build_win64 --config Release --prefix stage
        Compress-Archive -Path stage/bin/* -DestinationPath raven-windows-x64.zip

    - name: Check Product
      shell: bash
      run: |
        ls -l stage/bin
        file stage/bin/raven.exe

    - name: Archive Product
      uses: actions/upload-artifact@v7
      with:
        name: raven-windows-x64.zip
        path: raven-windows-x64.zip

  # One Python wheel per platform via cibuildwheel
  package_wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, windows-2022, macos-latest ]
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
        submodules: recursive
    - name: Build wheel
      uses: pypa/cibuildwheel@v4.2.1
    - name: Archive Python wheel
      uses: actions/upload-artifact@v7
      with:
        name: wheel-${{ matrix.os }}
        path: wheelhouse/*.whl

  # sdist only needs to be built once, no matrix needed
  package_sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev libgtk-3-dev
      - name: Install UV
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
      - name: Build Python wheel
        run: |
          uv build --sdist
      - name: Archive Python sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # Matches pattern used by adapter repos like otio-aaf-adapter.
  # Push to main -> rolling "Development Build" prerelease at tag `latest`.
  # Push a v* tag -> stable release at that tag. Both carry every build artifact.
  release:
    needs: [ Linux, MacOS, Emscripten, Windows, package_wheels, package_sdist ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-files
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Development Build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: release-files/*
